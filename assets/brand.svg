<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title description"><title id="title">ReflexFoundry</title><desc id="description">Teach agents which decisions can become reflexes. Evidence before delegation.</desc><rect width="1400" height="660" fill="#f3f1e9"/><path d="M76 62H122L110 84H92L82 102H108L96 122H74L90 92H74L90 62" fill="none" stroke="#ce4c22" stroke-width="5"/><text x="145" y="94" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-1">REFLEXFOUNDRY</text><text x="1280" y="88" fill="#62695e" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="2">EVIDENCE BEFORE DELEGATION</text><path d="M76 154H1324" stroke="#d5d7cb"/><text x="76" y="270" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="88" letter-spacing="-4">Fast decisions.</text><text x="76" y="368" fill="#ce4c22" font-family="Georgia,serif" font-size="92" font-style="italic" letter-spacing="-3">Earned trust.</text><text x="80" y="432" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="22">Compile repeated agent decisions into local reflexes.</text><text x="80" y="467" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="22">Keep them only when verified task outcomes improve.</text><g transform="translate(940 220)" fill="none" stroke-width="2"><path d="M0 0H210V150H0Z" stroke="#202720"/><path d="M25 32H182M25 65H133M25 98H158M25 129H85" stroke="#aab5a1"/><path d="M210 75H270V235H105V150" stroke="#ce4c22"/><path d="M98 160L105 150L112 160" stroke="#ce4c22"/><circle cx="270" cy="75" r="7" fill="#ce4c22" stroke="#ce4c22"/></g><path d="M76 533H1324" stroke="#d5d7cb"/><g fill="#62695e" font-family="monospace" font-size="13" letter-spacing="1"><text x="80" y="584">OBSERVE</text><text x="258" y="584">DISCOVER</text><text x="449" y="584">TRAIN</text><text x="608" y="584">EVALUATE</text><text x="805" y="584">SHADOW</text><text x="984" y="584">DEPLOY</text><text x="1164" y="584">MONITOR</text></g><g stroke="#ce4c22"><path d="M190 579H226M379 579H415M540 579H576M736 579H772M915 579H951M1096 579H1132"/></g></svg>
