name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts/analyze_native_v2.py assets/native-demo/render_amended.py benchmarks/codex-e2e-v2/continuation/continue_native.py benchmarks/codex-e2e-v2/continuation/tests
      - name: Type check
        run: mypy src/reflexfoundry
      - name: Contract and lifecycle tests
        run: python -B -m pytest -q tests benchmarks/codex-e2e-v2/continuation/tests
      - name: Build distributable packages
        run: python -m build
      - name: Verify wheel installation outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/reflex-wheel"
          "$RUNNER_TEMP/reflex-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reflex-wheel/bin/reflex" --version
          "$RUNNER_TEMP/reflex-wheel/bin/reflex" specs
