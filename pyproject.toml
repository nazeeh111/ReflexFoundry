[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexfoundry"
version = "0.2.0"
description = "Compile repeated agent decisions into local policies, gated by task outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Nazeeh", email = "nazeeh111@users.noreply.github.com"}]
dependencies = []

[project.optional-dependencies]
train = ["laya @ git+https://github.com/NandhaKishorM/laya.git@b9fe351ce81e2d974bca2bf219c1e4030c0a05ea", "numpy>=1.26,<3"]
apple = ["laya-mlx==0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15", "build>=1", "matplotlib>=3.9"]

[project.scripts]
reflex = "reflexfoundry.cli:main"

[project.urls]
Repository = "https://github.com/nazeeh111/ReflexFoundry"
Issues = "https://github.com/nazeeh111/ReflexFoundry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reflexfoundry = ["lab/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
