<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1090" viewBox="0 0 1680 1090" role="img" aria-labelledby="title desc"><title id="title">Amended native comparison: matched cohorts</title><desc id="desc">Trials 19 and 20 are a reviewed continuation after the phase-A halt and a publication/time gap, not an uninterrupted preregistered study. Trial 18 remains an invalid timeout of unknown cause, without retry or imputed usage. All combined estimates are post-amendment and descriptive. Compare each arm with its matching original-agent cohorts, not unequal-cohort arm means. Cached tokens are a subset of input. No causal or monetary claim.</desc><rect width="1680" height="1090" fill="#f3f1e9"/><text x="58" y="62" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">REFLEXFOUNDRY / AMENDED NATIVE COMPARISON</text><text x="58" y="113" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700">Matched cohorts. Preserved failure. Withheld deployment.</text><text x="58" y="157" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">AMENDED PARTIAL COMPARISON: 20 RESULTS, 19 VALID</text><text x="58" y="193" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">20/20 results / 19 valid / 19 successful / 11 valid inference observations</text><text x="58" y="229" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">15/16 usable comparisons; two repository groups, correlated repeats and shared baselines.</text><path d="M58 251H1622" stroke="#d5d7cb" stroke-width="1"/><text x="58" y="294" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">ARM / VERIFIED SUCCESS</text><text x="470" y="294" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">PAIRS</text><text x="610" y="294" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">CLI DELTA (s)</text><text x="850" y="294" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">PIPELINE DELTA (s)</text><text x="1160" y="294" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">INPUT DELTA</text><text x="1440" y="294" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">OUTPUT</text><text x="610" y="325" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Mean candidate minus matching original-agent cohorts</text><text x="58" y="382" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Original agent</text><text x="58" y="413" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">4/4 valid repairs; 0 protocol failures</text><text x="470" y="382" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Shared reference</text><text x="710" y="382" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400">Matched separately for each candidate arm</text><path d="M58 443H1622" stroke="#d5d7cb" stroke-width="1"/><text x="58" y="487" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Deterministic heuristic</text><text x="58" y="518" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">4/4 valid repairs; 0 protocol failures</text><text x="470" y="487" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">4/4</text><text x="610" y="487" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">-0.06</text><text x="850" y="487" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">-3.16</text><text x="1160" y="487" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+8,234.0</text><text x="1440" y="487" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+60.5</text><text x="850" y="518" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Cached subset delta: -4,544.0</text><path d="M58 548H1622" stroke="#d5d7cb" stroke-width="1"/><text x="58" y="592" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Ordinary Laya</text><text x="58" y="623" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">3/3 valid repairs; 1 protocol failures</text><text x="470" y="592" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">3/4</text><text x="610" y="592" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">+35.68</text><text x="850" y="592" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">+36.22</text><text x="1160" y="592" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+147,014.7</text><text x="1440" y="592" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+374.7</text><text x="850" y="623" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Cached subset delta: +143,872.0</text><path d="M58 653H1622" stroke="#d5d7cb" stroke-width="1"/><text x="58" y="697" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Trained always</text><text x="58" y="728" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">4/4 valid repairs; 0 protocol failures</text><text x="470" y="697" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">4/4</text><text x="610" y="697" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">+31.98</text><text x="850" y="697" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">+26.47</text><text x="1160" y="697" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+162,310.8</text><text x="1440" y="697" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+363.2</text><text x="850" y="728" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Cached subset delta: +144,384.0</text><path d="M58 758H1622" stroke="#d5d7cb" stroke-width="1"/><text x="58" y="802" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Selective shadow</text><text x="58" y="833" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">4/4 valid repairs; 0 protocol failures</text><text x="470" y="802" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">4/4</text><text x="610" y="802" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">+47.83</text><text x="850" y="802" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400">+47.25</text><text x="1160" y="802" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+195,815.5</text><text x="1440" y="802" fill="#202720" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">+419.5</text><text x="850" y="833" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400">Cached subset delta: +182,112.0</text><path d="M58 863H1622" stroke="#d5d7cb" stroke-width="1"/><text x="58" y="949" fill="#ce4c22" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Reviewed continuation after a halt and publication/time gap; this is not an uninterrupted study.</text><text x="58" y="984" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Trial18 remains an invalid timeout of unknown cause. Usage is unavailable, not zero. No retry or imputation.</text><text x="58" y="1016" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Actual independent post-run checks; agent-side internal validation is agent-reported. No causal or currency claim.</text><text x="58" y="1048" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Cached tokens are included in input; repeated pairs share baselines. Arm means are not an effect estimate.</text><text x="58" y="1077" fill="#62695e" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Amendment SHA-256 2851023e7a647d9d32d65966c10063f60573c8d1d80477f2b07c309fd7a7dcfd</text></svg>